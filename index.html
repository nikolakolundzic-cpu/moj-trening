<!DOCTYPE html>
<html lang="sr-ME">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Moj trening</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#d9411f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Trening">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* VOICE: energično, jasno, kao dobar trener koji ne priča previše
   IDEA: kartica za trening iz teretane — dan, vježba, serije, kvačice
   PICTURE: sama aplikacija: plan dana i veliki tajmer
   COLOUR and TYPE: paradajz-crvena traka, topla bijela podloga, plava za odmor; Barlow Condensed + Barlow
   LAYOUT: crvena traka sa naslovom i karticama, jedna mirna kolona sadržaja */
:root{color-scheme:light dark;--bg:light-dark(#fbf6f0,#16120f);--card:light-dark(#fff,#221c18);--ink:light-dark(#1f1a17,#f4ece4);--mute:light-dark(#6d625a,#b3a69b);--line:light-dark(#e8ddd2,#3a302a);--red:light-dark(#d9411f,#ff6a4d);--sand:light-dark(#f3e6d8,#2b231e);--blue:light-dark(#2357c6,#8fb0ff)}
:root{--hdr:#d9411f}
:root[data-skin=f]{--hdr:#d6407a;--bg:light-dark(#fff6f9,#1a1216);--card:light-dark(#fff,#261a20);--line:light-dark(#f2d5e1,#432a35);--red:light-dark(#d6407a,#ff7fb2);--sand:light-dark(#fce4ee,#321f28);--blue:light-dark(#7b4fd1,#b79cff);--mute:light-dark(#75606a,#bba4ae)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Barlow,system-ui,sans-serif;overflow-x:clip}
h1,h2,h3,.big{font-family:"Barlow Condensed",Barlow,sans-serif;line-height:1.05;text-wrap:balance;margin:0}
.top{background:var(--hdr);color:#fff;padding:22px max(5vw,16px) 0}
.top h1{font-size:clamp(32px,7vw,46px)}
.top p{margin:4px 0 14px;opacity:.9}
.hd{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.skin{display:flex;background:rgba(0,0,0,.18);border-radius:999px;padding:3px}
.skin button{background:none;border:0;color:#fff;font:600 15px Barlow,sans-serif;padding:8px 14px;min-height:40px;border-radius:999px;cursor:pointer}
.skin button.on{background:#fff;color:var(--hdr)}
nav{display:flex;gap:4px;overflow-x:auto;max-width:760px}
nav button{flex:none;background:none;border:0;color:#fff;font:600 16px Barlow,sans-serif;padding:12px 16px;min-height:44px;border-radius:10px 10px 0 0;opacity:.85;cursor:pointer}
nav button.on{background:var(--bg);color:var(--ink);opacity:1}
@media(max-width:440px){nav{gap:0}nav button{padding:10px 6px;font-size:14px}}@media(max-width:370px){nav button{padding:10px 4px;font-size:13px}}
main{max-width:760px;padding:20px max(5vw,16px) 60px}
.top>div{max-width:760px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:14px}
h2{font-size:32px;margin-bottom:10px}h3{font-size:22px}
label{display:block;font-weight:600;margin:14px 0 6px}
input,select{width:100%;font:16px Barlow,sans-serif;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);min-height:44px}
input:focus,select:focus,button:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(140px,100%),1fr));gap:0 12px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:9px 16px;min-height:44px;font:500 16px Barlow,sans-serif;cursor:pointer}
.chip.on{background:var(--red);border-color:var(--red);color:#fff}
.btn{background:var(--red);color:#fff;border:0;border-radius:12px;font:700 18px "Barlow Condensed",sans-serif;letter-spacing:.02em;padding:12px 22px;min-height:48px;cursor:pointer}
.btn.ghost{background:none;color:var(--ink);border:1px solid var(--line)}
.btn.blue{background:var(--blue)}
.mute{color:var(--mute);font-size:14px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:14px}
.stat{background:var(--sand);border-radius:12px;padding:12px}
.stat b{display:block;font:700 clamp(24px,6vw,30px) "Barlow Condensed",sans-serif;white-space:nowrap}
.stat span{font-size:13px;color:var(--mute)}
.day{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.tag{background:var(--sand);border-radius:999px;padding:3px 10px;font-size:14px;font-weight:600;white-space:nowrap}
.tag.ok{background:var(--red);color:#fff}
ol.ex{list-style:none;padding:0;margin:10px 0 14px}
ol.ex li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;padding:10px 0;border-top:1px solid var(--line)}
ol.ex li b{font-weight:600}ol.ex li .dose{font-weight:600;white-space:nowrap;text-align:right}
ol.ex li details{grid-column:1/-1;font-size:15px;color:var(--mute)}
summary{cursor:pointer;padding:4px 0}
.rest{color:var(--mute);font-size:15px;padding:12px 18px;border:1px dashed var(--line);border-radius:14px;margin-bottom:14px}
.live{text-align:center;padding:26px 18px}
.live .big{font-size:clamp(64px,22vw,120px);color:var(--red);font-variant-numeric:tabular-nums}
.live.resting .big{color:var(--blue)}
.live h2{font-size:clamp(32px,8vw,46px);margin:6px 0}
.dots{display:flex;justify-content:center;gap:8px;margin:12px 0}
.dots i{width:14px;height:14px;border-radius:50%;background:var(--line)}.dots i.on{background:var(--red)}
.bar{height:8px;background:var(--line);border-radius:9px;overflow:hidden;margin-bottom:16px}.bar div{height:100%;background:var(--red)}
.acts{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:16px}
.fig{position:relative;min-height:220px}.fig>svg{position:absolute;inset:0;width:100%;height:100%}
table{width:100%;border-collapse:collapse}td{padding:9px 4px;border-top:1px solid var(--line)}td.n{text-align:right;white-space:nowrap}
.x{background:none;border:0;color:var(--mute);font-size:20px;min-width:44px;min-height:44px;cursor:pointer}
:root{--ok:light-dark(#23894d,#5fd08d);--no:light-dark(#c62f2f,#ff7b6e);--okb:light-dark(#e4f4ea,#163224);--nob:light-dark(#fbe6e4,#3a1c1a)}
ol.ex li{grid-template-columns:minmax(0,1fr) auto;align-items:center;padding:10px 8px;border-radius:10px;border-top-color:transparent;box-shadow:0 -1px 0 var(--line)}
ol.ex li.ok{background:var(--okb)}ol.ex li.no{background:var(--nob)}
ol.ex li .dose{text-align:left;color:var(--mute)}
.mk{display:flex;gap:6px}
.mb{width:44px;height:44px;border-radius:50%;border:2px solid var(--line);background:var(--card);color:var(--mute);font-size:19px;font-weight:700;cursor:pointer}
.mb.ok.on{background:var(--ok);border-color:var(--ok);color:#fff}.mb.no.on{background:var(--no);border-color:var(--no);color:#fff}
.wk2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:12px 0 10px}
.wk2 span{display:block;font-size:14px;color:var(--mute)}
.pct{font:700 clamp(40px,11vw,56px)/1 "Barlow Condensed",sans-serif}
.sbar{display:flex;height:14px;border-radius:9px;overflow:hidden;background:var(--line)}.sbar i{display:block;height:100%}
.thumb{width:72px;height:50px;background:var(--sand);border-radius:8px;display:block}
ol.ex li:has(.thumb){grid-template-columns:72px minmax(0,1fr) auto}
ol.ex.plain li{display:block}
svg.demo{display:block;width:100%;max-width:320px;aspect-ratio:200/140;background:var(--sand);border-radius:10px;margin:8px 0}
svg.big{display:block;width:100%;max-width:340px;aspect-ratio:200/140;margin:8px auto;background:var(--sand);border-radius:14px}
.yt{display:inline-block;margin-top:8px;color:var(--red);font-weight:600;padding:8px 0}
.pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr));gap:8px;margin-bottom:6px}
.pk{display:grid;grid-template-columns:72px minmax(0,1fr) auto;align-items:center;gap:10px;text-align:left;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:6px 14px 6px 6px;font:500 16px Barlow,sans-serif;color:var(--ink);cursor:pointer;min-height:62px}
.pk b{font-size:26px;color:var(--red);font-weight:600}.pk:disabled,.btn:disabled{opacity:.4;cursor:default}
.gh{margin:18px 0 8px;font-size:21px}
.editing{border:2px solid var(--red)}
.calh{display:flex;align-items:center;justify-content:space-between;gap:8px}.calh h2{margin:0;font-size:30px;text-transform:capitalize}.calh .x{font-size:30px;color:var(--ink)}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;margin-top:8px}
.wd{text-align:center;font-size:13px;color:var(--mute);padding:4px 0}
.cd{position:relative;aspect-ratio:1;min-height:40px;border:0;border-radius:10px;background:var(--bg);color:var(--ink);font:600 16px Barlow,sans-serif;cursor:pointer;padding:0}
.cd.plan{box-shadow:inset 0 0 0 2px var(--red)}
.cd.ok{background:var(--ok);color:#fff}
.cd.part{background:var(--okb);box-shadow:inset 0 0 0 2px var(--ok)}
.cd.miss{background:var(--no);color:#fff}
.cd.today{font-weight:800;text-decoration:underline;text-underline-offset:3px}
.cd.sel{outline:3px solid var(--blue);outline-offset:1px}
.cd i{position:absolute;top:5px;right:6px;width:6px;height:6px;border-radius:50%;background:currentColor}
.leg{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:12px;font-size:14px;color:var(--mute)}
.leg span::before{content:"";display:inline-block;width:12px;height:12px;border-radius:4px;margin-right:6px;vertical-align:-1px;background:var(--c);box-shadow:inset 0 0 0 2px var(--b,transparent)}
.sug{font-size:14px;color:var(--blue);font-weight:600}
.logrow{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin:6px 0}.logrow label{margin:0;font-size:14px;text-align:left}.logrow input{width:120px;display:block;margin-top:4px;text-align:center;font-size:20px}
.stack td{border-top:0}
@media(max-width:600px){.stack thead{display:none}.stack tr{display:grid;grid-template-columns:repeat(4,minmax(0,1fr)) 44px;align-items:end;padding:8px 0;border-top:1px solid var(--line)}.stack td{padding:2px 0;text-align:left}.stack td::before{content:attr(data-l);display:block;font-size:12px;color:var(--mute)}.stack td:first-child{grid-column:1/-1}}
.stats.four{grid-template-columns:repeat(2,minmax(0,1fr))}
.stat b{overflow-wrap:anywhere}
th{text-align:left;font-size:14px;color:var(--mute);font-weight:600;padding:6px 4px}
[data-hint=off] ol.ex .thumb,[data-hint=off] ol.ex details,[data-hint=off] svg.big,[data-hint=off] .howto{display:none}
[data-hint=off] ol.ex li:has(.thumb){grid-template-columns:minmax(0,1fr) auto}
[hidden]{display:none!important}
.dayc{padding:0;overflow:hidden}
.dayh{display:flex;align-items:center;gap:10px;width:100%;padding:14px 16px;background:none;border:0;color:var(--ink);text-align:left;font:inherit;cursor:pointer;min-height:64px}
.dayh .dl{flex:1;min-width:0}.dayh b{font:700 23px/1.1 "Barlow Condensed",sans-serif}
.chev{font-size:26px;color:var(--mute);line-height:1;transition:transform .2s}.dayc.open .chev{transform:rotate(90deg)}
.dayb{padding:0 16px 16px}
.dayc.today{border:2px solid var(--red)}
.tag.no{background:var(--no);color:#fff}.tag.today{background:var(--red);color:#fff}
.makeup{border:2px dashed var(--red)}
.note{font-size:14px;color:var(--mute);margin-top:20px}
@media(prefers-reduced-motion:no-preference){.live .big{transition:color .3s}.bar div{transition:width .4s}}
</style>
</head>
<body>
<header class="top"><div>
<h1 id="ttl">Moj trening</h1>
<p id="sub">Program vježbi napravljen po tvojim mjerama</p>
<nav id="nav">
<button data-t="plan">Plan</button>
<button data-t="cal">Kalendar</button>
<button data-t="go">Trening</button>
<button data-t="nap">Napredak</button>
<button data-t="pro">Podešavanja</button>
</nav></div></header>
<main id="app"></main>
<script src="firebase-config.js"></script>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,onAuthStateChanged,signInWithEmailAndPassword,createUserWithEmailAndPassword,signInWithPopup,signInWithRedirect,GoogleAuthProvider,sendPasswordResetEmail,signOut} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {initializeFirestore,persistentLocalCache,doc,getDoc,setDoc} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import {getMessaging,getToken,isSupported} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-messaging.js";
const firebaseConfig=self.firebaseConfig;
let swReg=null;
if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js').then(r=>swReg=r).catch(e=>console.log('[trening] sw',e));
const fb=initializeApp(firebaseConfig),auth=getAuth(fb),fdb=initializeFirestore(fb,{localCache:persistentLocalCache()});
{
const $=s=>document.querySelector(s);
const esc=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const EMPTY=()=>({profile:null,start:null,weights:[],done:[],skin:null});
let S=EMPTY(),uid=null,authReady=false,saveT=null,saving=Promise.resolve();
const save=()=>{if(!uid)return;clearTimeout(saveT);const u=uid;saveT=setTimeout(()=>{if(S.remind&&S.profile){const days={},td=today();for(const off of [0,1,2,3]){const plan=build(S.profile),wk=wkStart(off);plan.forEach((d,i)=>{const dt=dateOf(wk,i,d.dn);if(dt&&dt>=td)days[dt]=d.name})}S.remind.days=days}const body=JSON.parse(JSON.stringify(S));saving=saving.then(()=>setDoc(doc(fdb,'users',u),body)).catch(e=>console.log('[trening] save',e))},500)};
const lday=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const today=()=>lday(new Date());
const addD=(s,n)=>{const d=new Date(s+'T12:00:00');d.setDate(d.getDate()+n);return lday(d)};
const wkOf=s=>{const d=new Date(s+'T12:00:00');d.setDate(d.getDate()-((d.getDay()+6)%7));return lday(d)};
const wkStart=off=>addD(wkOf(today()),off*7);
const range=off=>{const a=wkStart(off),b=addD(a,6),f=x=>x.slice(8)+'.'+x.slice(5,7)+'.';return f(a)+' – '+f(b)};

// g: noge, gur (guranje), vuc (vuča), core, kar (kardio); eq: 0 bez opreme, b bučice, t teretana; d: težina 1-3; hi: skakanje; st: opterećuje
const EX=[
{n:'Čučanj do stolice',g:'noge',eq:'0',d:1,st:[],o:'Stani ispred stolice, spuštaj se kao da sjedaš dok ne dodirneš stolicu, pa ustani.',s:'Koljena prate prste, težina na petama.'},
{n:'Glute most',g:'noge',eq:'0',d:1,st:[],o:'Lezi na leđa, savij koljena i podigni kukove dok tijelo ne bude u liniji od ramena do koljena.',s:'Stegni zadnjicu na vrhu, ne izvijaj donji dio leđa.'},
{n:'Podizanje na prste',g:'noge',eq:'0',d:1,st:[],o:'Pridrži se za zid i polako se podiži na prste pa spuštaj.',s:'Gore zadrži sekundu.'},
{n:'Čučanj',g:'noge',eq:'0',d:2,st:['koljena'],o:'Stopala u širini ramena, spuštaj kukove unazad i nadolje do paralele, pa ustani.',s:'Grudi gore, pete ne odižu.'},
{n:'Iskorak unazad',g:'noge',eq:'0',d:2,st:['koljena'],o:'Korakni jednom nogom unazad i spusti zadnje koljeno blizu poda. Naizmjenično.',s:'Prednje koljeno ostaje iznad stopala.'},
{n:'Most na jednoj nozi',g:'noge',eq:'0',d:3,st:[],o:'Kao glute most, ali sa jednom nogom ispruženom u vazduhu. Broj po nozi.',s:'Kukovi ostaju ravni, ne naginju se.'},
{n:'Čučanj sa bučicom (goblet)',g:'noge',eq:'b',d:2,st:['koljena'],o:'Drži bučicu uz grudi objema rukama i radi čučanj.',s:'Laktovi idu između koljena.'},
{n:'Rumunsko mrtvo dizanje',g:'noge',eq:'b',d:2,st:['leđa'],o:'Bučice ispred butina, guraj kukove unazad i spuštaj bučice niz noge do ispod koljena.',s:'Leđa ravna cijelo vrijeme, koljena blago savijena.'},
{n:'Iskorak sa bučicama',g:'noge',eq:'b',d:3,st:['koljena'],o:'Bučice u rukama, iskorak unazad naizmjenično.',s:'Kontrolisano spuštanje.'},
{n:'Leg press',g:'noge',eq:'t',d:2,st:['koljena'],o:'Na mašini guraj platformu nogama, ne zaključavaj koljena na vrhu.',s:'Donji dio leđa prislonjen uz sjedište.'},
{n:'Hip thrust na klupi',g:'noge',eq:'t',d:3,st:[],o:'Leđa na klupi, šipka ili bučica na kukovima, podiži kukove.',s:'Brada blago spuštena, pogled naprijed.'},
{n:'Sklek uz zid',g:'gur',eq:'0',d:1,st:[],o:'Ruke na zidu u visini ramena, spuštaj grudi prema zidu i odgurni se.',s:'Tijelo pravo kao daska.'},
{n:'Sklek na koljenima',g:'gur',eq:'0',d:2,st:['ramena'],o:'Sklek sa koljenima na podu.',s:'Laktovi pod uglom od oko 45° od tijela.'},
{n:'Sklek',g:'gur',eq:'0',d:3,st:['ramena'],o:'Klasičan sklek, grudi skoro do poda.',s:'Stomak stegnut, kukovi ne vise.'},
{n:'Potisak bučica na podu',g:'gur',eq:'b',d:1,st:[],o:'Lezi na leđa, bučice iznad grudi, spuštaj dok laktovi ne dodirnu pod.',s:'Pod štiti ramena, dobra vježba za početak.'},
{n:'Potisak bučica iznad glave',g:'gur',eq:'b',d:2,st:['ramena','leđa'],o:'Sjedeći ili stojeći guraj bučice iznad glave.',s:'Ne izvijaj leđa, stomak stegnut.'},
{n:'Potisak na mašini za grudi',g:'gur',eq:'t',d:2,st:[],o:'Sjedi na mašini i guraj ručke naprijed.',s:'Ručke u visini sredine grudi.'},
{n:'Y-T podizanje na stomaku',g:'vuc',eq:'0',d:1,st:[],o:'Lezi na stomak, podiži ruke u obliku slova Y, pa T, i polako spuštaj.',s:'Odlično za držanje i leđa.'},
{n:'Superman',g:'vuc',eq:'0',d:2,st:['leđa'],o:'Na stomaku istovremeno podigni ruke i noge, zadrži 2 sekunde.',s:'Pogled u pod, vrat opušten.'},
{n:'Veslanje bučicom jednom rukom',g:'vuc',eq:'b',d:2,st:[],o:'Osloni ruku i koljeno na klupu ili stolicu, vuci bučicu prema kuku.',s:'Lopatica ide unazad, leđa ravna.'},
{n:'Veslanje sa obje bučice u pretklonu',g:'vuc',eq:'b',d:3,st:['leđa'],o:'Pretklon sa ravnim leđima, vuci obje bučice prema stomaku.',s:'Ne trzaj, kontroliši spuštanje.'},
{n:'Lat povlačenje',g:'vuc',eq:'t',d:1,st:[],o:'Na mašini vuci šipku do vrha grudi.',s:'Vuci laktovima, ne rukama.'},
{n:'Veslanje na sajli sjedeći',g:'vuc',eq:'t',d:2,st:[],o:'Sjedi uspravno i vuci ručku prema stomaku.',s:'Ramena dolje, daleko od ušiju.'},
{n:'Mrtva buba',g:'core',eq:'0',d:1,st:[],o:'Lezi na leđa, ruke gore, koljena savijena. Spuštaj suprotnu ruku i nogu ka podu.',s:'Donji dio leđa stalno pritisnut uz pod.'},
{n:'Bird-dog',g:'core',eq:'0',d:1,st:[],o:'Na sve četiri ispruži suprotnu ruku i nogu, zadrži sekundu. Naizmjenično.',s:'Kukovi ostaju ravni.'},
{n:'Plank na podlakticama',g:'core',eq:'0',d:2,t:1,st:['ramena'],o:'Oslonac na podlakticama i prstima, tijelo pravo.',s:'Stegni stomak i zadnjicu, ne zadržavaj dah.'},

function build(p,raw,nb){
 const lvl=+p.lvl,cnt={};
 const G=GOAL[p.goal],bonus=nb?0:Math.min(3,Math.floor(qualW()/2)),adj=nb?0:(S.adj||0);
 const sets=Math.max(2,G.sets-(lvl==1?1:0));
 const D=isDaily(p),R=p.min==30?4:3,DS=p.min==30?45:40;
 const dz=e=>{if(D)return Object.assign({},e,{t:1,sets:R,reps:0,sec:Math.max(20,DS+(lvl==1?-5:lvl==3?5:0)+bonus*5+adj*5)});const sec=e.t?Math.max(15,G.sec+(lvl==1?-10:lvl==3?15:0)+bonus*5+adj*5):0;return Object.assign({},e,{sets:e.g=='kar'?Math.min(sets,3):sets,reps:e.t?0:Math.max(5,G.reps+bonus*2+adj*2),sec})};
 return daysOf(p).map(([dn,k],di)=>{
  const used=new Set(),slots=T[k].s.slice();
  if(D){if(p.min==30)slots.push(T[k].x)}else if((p.goal=='mrs'||p.goal=='kon')&&k!='kar')slots.push('kar');
  const rec=isReps(p)?REPSD[di].c.concat(p.min==30?[REPSD[di].x]:[]).map(ch=>pickChain(p,ch,used)):slots.map(g=>{const c=poolFor(p,g);let i=cnt[g]||0,e,tries=0;
   do{e=c[i%c.length];i++;tries++}while(used.has(e.n)&&tries<c.length);
   cnt[g]=i;used.add(e.n);return e});
  if(isReps(p))rec.forEach(e=>slots.push(e.g));
  const cu=!raw&&S.custom&&S.custom[ckey(p)]&&S.custom[ckey(p)][di];
  const list=cu?cu.map(n=>EX.find(e=>e.n==n)).filter(Boolean):rec;
  return {dn,name:T[k].n,ex:(list.length?list:rec).map(dz),rec:rec.map(e=>e.n),slots,custom:!!(cu&&list.length),rest:D?(p.min==30?15:20):G.rest,circ:D};
 });
}

 plan.map((d,i)=>{if(editDay===i)return vEdit(d,i);const dm=m[i]||{},all=d.ex.every((_,j)=>dm[j]=='ok'),bn=d.base||d.ex.length,op=openDay===i;

  const st=all?'<span class="tag ok">✓ Odrađeno</span>':o?'<span class="tag">'+o+'/'+d.ex.length+'</span>':dt&&dt<td?'<span class="tag no">Propušteno</span>':dt==td?'<span class="tag today">Danas</span>':x?'<span class="tag">✗ '+x+'</span>':'';
  const head='<button class="dayh" data-open="'+i+'" aria-expanded="'+op+'"><span class="dl"><b>'+d.dn+'</b> <span class="mute">'+(dt?(dt==addD(wk,DIDX[d.dn])?fmtD(dt):'→ '+wdOf(dt).slice(0,3).toLowerCase()+' '+fmtD(dt)):'nije raspoređeno')+'</span><br><span class="mute">'+(d.custom?'Tvoj izbor':d.name)+' · '+d.ex.length+' vježbi</span></span>'+st+'<span class="chev" aria-hidden="true">›</span></button>';
  if(!op)return '<div class="card dayc'+(dt==td?' today':'')+'">'+head+'</div>';
  return '<div class="card dayc open'+(dt==td?' today':'')+'" id="day'+i+'">'+head+'<div class="dayb"><p class="mute" style="margin:0">'+dinfo(wk,i,d)+(d.circ?' · kružno: '+d.ex[0].sets+' kruga, pauza '+d.rest+' s između vježbi':' · odmor između serija '+d.rest+' s')+' · označi ✓ ili ✗ za svaku vježbu</p><ol class="ex">'+
  d.ex.slice(0,bn).map((e,j)=>exLi(e,wk+'|'+i+'|'+j,dm[j])).join('')+(bn<d.ex.length?'</ol><h3 class="gh">Nadoknada iz prošle nedelje</h3><ol class="ex">'+d.ex.slice(bn).map((e,j)=>exLi(e,wk+'|'+i+'|'+(bn+j),dm[bn+j])).join(''):'')+
  '</ol><div class="acts" style="justify-content:flex-start;margin-top:0"><button class="btn" data-go="'+i+'">Počni trening</button><button class="btn ghost" data-edit="'+i+'">Izaberi vježbe</button></div></div></div>'}).join('')+
 '<div class="card"><h3>Nemaš vremena ili hoćeš više?</h3><div class="acts" style="justify-content:flex-start;margin-top:10px"><button class="btn ghost" id="quick">Kratki trening · 10 min</button><button class="btn ghost" id="strb">Istezanje · 3 min</button></div><p class="mute" style="margin-bottom:0">Kratki trening se u kalendaru računa kao djelimično odrađen dan. Istezanje radi poslije svakog treninga.</p></div>'+
 '<p class="mute">Plan postaje teži poslije svake dvije nedelje u kojima odradiš bar 80%. Do sada takvih nedelja: '+qualW()+'.'+(S.adj?' Po tvojim ocjenama treninzi su '+(S.adj>0?'pojačani':'olakšani')+' za '+Math.abs(S.adj*2)+' ponavljanja.':'')+'</p>'+
 '<div class="card"><h3>Zagrijavanje prije svakog treninga</h3><ol class="ex plain">'+WARM.map(w=>'<li><span>'+w+'</span></li>').join('')+'</ol></div>'+

 (isDaily(p)?'<p class="rest">Svaki trening traje oko '+(p.min||20)+' min sa zagrijavanjem i istezanjem. Ako je neki dan preteško, uradi kratki trening ili samo istezanje.</p>':'<p class="rest">Ostali dani su za odmor, šetnju ili lagano istezanje. Mišići jačaju dok se odmaraju.</p>')+
 '<p class="note">Ovo je opšti program, nije savjet ljekara. Ako postoje zdravstveni problemi, trudnoća ili bol tokom vježbe, prvo se posavjetuj sa ljekarom.</p>';
}
function bindPlan(){
 bindEdit();
 document.querySelectorAll('[data-open]').forEach(b=>b.addEventListener('click',()=>{const i=+b.dataset.open;openDay=openDay===i?-1:i;render();const c=$('#day'+i);if(c)c.scrollIntoView({block:'nearest'})}));
 {const q=$('#quick');if(q)q.addEventListener('click',()=>startSpecial('quick'));const t=$('#strb');if(t)t.addEventListener('click',()=>startSpecial('str'))}
 document.querySelectorAll('[data-go]').forEach(b=>b.addEventListener('click',()=>startW(+b.dataset.go)));
 document.querySelectorAll('[data-mk]').forEach(b=>b.addEventListener('click',()=>{const [wk,d,j,v]=b.dataset.mk.split('|');setMark(wk,d,j,v,true);render()}));
}
function vHist(){
 if(!S.start)return '';const rows=[];
 for(let o=-1;o>=-8;o--){if(addD(wkStart(o),6)<S.start)break;const s=summ(o);if(!s.total)continue;
  rows.push('<tr><td>'+range(o)+'</td><td class="n" style="color:var(--ok)">✓ '+s.okp+'%</td><td class="n" style="color:var(--no)">✗ '+s.nop+'%</td></tr>')}
 return rows.length?'<div class="card"><h3>Prethodne nedelje</h3><table>'+rows.join('')+'</table></div>':'';
}
let actx=null;
function beep(){try{actx=actx||new AudioContext();const o=actx.createOscillator(),g=actx.createGain();o.connect(g);g.connect(actx.destination);o.frequency.value=880;g.gain.value=.15;o.start();o.stop(actx.currentTime+.25)}catch(e){}try{navigator.vibrate&&navigator.vibrate(300)}catch(e){}}
function startW(k){const d=withMake(build(S.profile))[k];W={k,d,i:0,set:1,ph:'ready',t:0,rec:{}};try{actx=actx||new AudioContext()}catch(e){}setTab('go')}
function stopTick(){clearInterval(tick);tick=null}
function run(sec,ph){stopTick();W.ph=ph;W.t=sec;render();tick=setInterval(()=>{W.t--;if(W.t<=0){stopTick();beep();if(ph=='rest')W.ph='ready';else{W.rec=W.rec||{};(W.rec[W.i]=W.rec[W.i]||[]).push({r:sec});afterSet()}render();return}const el=$('#clock');if(el)el.textContent=fmt(W.t)},1000)}
const fmt=s=>s>=60?Math.floor(s/60)+':'+String(s%60).padStart(2,'0'):String(s);
function finishW(){stopTick();W.ph='done';if(W.k>=0)S.done.push({d:today(),k:W.k});if(W.mode=='quick'){S.quick=S.quick||{};S.quick[today()]=1}save();render()}
function cNext(){const L=W.d.ex.length,R=Math.max(...W.d.ex.map(x=>x.sets));let i=W.i,r=W.set;
 for(let g=0;g<=L*R;g++){i++;if(i>=L){i=0;r++}if(r>R)return finishW();if(!(W.sk||{})[i]&&r<=W.d.ex[i].sets){const nr=r!=W.set;W.i=i;W.set=r;W.nr=nr;return run(nr?60:W.d.rest,'rest')}}
 finishW()}
function afterSet(){const e=W.d.ex[W.i];
 if(W.d.circ){if(W.set>=e.sets){if(W.k>=0)setMark(wkStart(0),W.k,W.i,'ok');commitLog(W.i)}cNext();return}
 if(W.set<e.sets){W.set++;run(W.d.rest,'rest');return}
 if(W.k>=0)setMark(wkStart(0),W.k,W.i,'ok');commitLog(W.i);nextEx()}
function nextEx(){
 if(W.i<W.d.ex.length-1){W.i++;W.set=1;run(W.d.rest,'rest');return}
 stopTick();W.ph='done';if(W.k>=0)S.done.push({d:today(),k:W.k});if(W.mode=='quick'){S.quick=S.quick||{};S.quick[today()]=1}save();render()}
function vGo(){
 if(!S.profile)return vPro();
 if(!W)return '<div class="card"><h2>Izaberi trening</h2><p class="mute">Na kartici Plan klikni „Počni trening” kod dana koji želiš.</p><button class="btn" id="toplan">Idi na plan</button></div>';
 const d=W.d,e=d.ex[W.i],tot=d.ex.reduce((a,x)=>a+x.sets,0),doneN=d.circ?d.ex.reduce((a,x,j)=>a+Math.min(x.sets,W.set-1+(j<W.i?1:0)),0):d.ex.slice(0,W.i).reduce((a,x)=>a+x.sets,0)+W.set-1;
 if(W.ph=='done')return '<div class="card live"><h2>'+(W.mode=='str'?'Istezanje završeno!':'Bravo, trening završen!')+'</h2><p class="mute">'+d.name+' · '+d.ex.length+' vježbi · '+tot+' serija</p>'+
 (W.mode=='str'?'':W.rated!==undefined?'<p>'+['Važi, sledeći treninzi su malo lakši.','Super, ostaje ovako.','Važi, sledeći treninzi su malo teži.'][W.rated+1]+'</p>':'<p><b>Kakav je bio trening?</b></p><div class="chips" style="justify-content:center"><button class="chip" data-rate="1">Lako</button><button class="chip" data-rate="0">Taman</button><button class="chip" data-rate="-1">Teško</button></div>')+
 '<div class="acts">'+(W.mode=='str'?'':'<button class="btn blue" id="strgo">Istezanje · 3 min</button>')+'<button class="btn" id="toplan">Nazad na plan</button></div></div>';
 const next=e;
 let mid;
 if(W.ph=='rest')mid='<p class="mute">'+(d.circ&&W.nr?'Odmor prije '+W.set+'. kruga':'Odmor')+'</p><div class="big" id="clock">'+fmt(W.t)+'</div><p>Sledeće: <b>'+next.n+'</b> · '+dose(next)+'</p><div class="acts"><button class="btn blue" id="skip">Preskoči odmor</button></div>';
 else if(W.ph=='work')mid='<div class="big" id="clock">'+fmt(W.t)+'</div><div class="acts"><button class="btn ghost" id="fin">Završi ranije</button></div>';
 else mid='<div class="big">'+(e.t?e.sec+' s':e.reps)+'</div><p class="mute" style="margin-top:0">'+(e.t?'sekundi':'ponavljanja')+'</p>'+(sugg(e)?'<p class="sug">'+sugg(e)+'</p>':'')+
 (e.t||W.mode?'':'<div class="logrow"><label>Ponavljanja<input id="lr" type="number" inputmode="numeric" min="0" max="200" value="'+e.reps+'"></label>'+(isWt(e)?'<label>Težina (kg)<input id="lk" type="number" inputmode="decimal" min="0" max="300" step="0.5" value="'+(((W.rec||{})[W.i]||[]).slice(-1)[0]||{kg:sugKg(e)}).kg+'"></label>':'')+'</div>')+'<div class="acts">'+(e.t?'<button class="btn" id="tmr">Pokreni '+e.sec+' s</button>':'<button class="btn" id="fin">Serija gotova</button>')+'<button class="btn ghost" id="skx">Preskoči vježbu</button></div>';
 return '<div class="bar"><div style="width:'+Math.round(doneN/tot*100)+'%"></div></div><div class="card live'+(W.ph=='rest'?' resting':'')+'"><p class="mute" style="margin:0">Vježba '+(W.i+1)+' od '+d.ex.length+'</p><h2>'+e.n+'</h2>'+anim(e.n,'big')+'<div class="dots">'+Array.from({length:e.sets},(_,j)=>'<i class="'+(j<W.set-1?'on':'')+'"></i>').join('')+'</div><p class="mute">'+(d.circ?'Krug':'Serija')+' '+W.set+' od '+e.sets+'</p>'+mid+'</div>'+
 '<div class="card howto"><h3>Kako se radi</h3><p>'+e.o+'</p><p><strong>Savjet:</strong> '+e.s+'</p><p>'+ytLink(e.n)+'</p></div><button class="btn ghost" id="quit">Prekini trening</button>';
}
function bindGo(){
 const on=(id,f)=>{const b=$('#'+id);if(b)b.addEventListener('click',f)};
 on('toplan',()=>{W=null;setTab('plan')});on('strgo',()=>startSpecial('str'));
 document.querySelectorAll('[data-rate]').forEach(b=>b.addEventListener('click',()=>{const v=+b.dataset.rate;S.adj=Math.max(-3,Math.min(3,(S.adj||0)+v));S.rates=(S.rates||[]).concat({d:today(),v}).slice(-30);W.rated=v;save();render()}));on('skip',()=>{stopTick();W.ph='ready';render()});
 on('tmr',()=>run(W.d.ex[W.i].sec,'work'));on('fin',()=>{stopTick();const e=W.d.ex[W.i];W.rec=W.rec||{};const R=W.rec[W.i]=W.rec[W.i]||[];
  if(W.ph=='ready'&&!e.t){const r=+(($('#lr')||{}).value||e.reps),k=$('#lk')?+$('#lk').value||0:0;R.push(k?{r,kg:k}:{r})}
  else if(e.t)R.push({r:W.ph=='work'?e.sec-W.t:e.sec});
  afterSet();render()});
 on('skx',()=>{stopTick();if(W.k>=0)setMark(wkStart(0),W.k,W.i,'no');if(W.d.circ){W.sk=W.sk||{};W.sk[W.i]=1;cNext()}else nextEx();render()});
 on('quit',()=>{stopTick();W=null;setTab('plan')});
}

function vNap(){
 if(!S.profile)return vPro();
 const ws=S.weights,f=ws[0],l=ws[ws.length-1],diff=f&&l?(l.kg-f.kg):0,b=bmi(S.profile);
 return '<div class="stats four">'+stat((l?l.kg:'–')+' kg','trenutno')+stat((diff>0?'+':'')+diff.toFixed(1)+' kg','od početka')+stat(b.toFixed(1),'BMI · '+bmiTxt(b))+stat(S.done.length,'treninga ukupno')+'</div>'+vMeas()+
 vHist()+'<form class="card" id="wf"><h3>Upiši današnju težinu</h3><div style="display:flex;gap:10px;margin-top:10px"><input id="nw" type="number" inputmode="decimal" step="0.1" min="30" max="250" placeholder="npr. 64.5" aria-label="Težina u kg" required><button class="btn" style="flex:none">Dodaj</button></div><p class="mute">Najbolje jednom nedeljno, ujutru, istim danom.</p></form>'+
 '<div class="card"><h3>Kretanje težine</h3>'+(ws.length>1?'<div class="fig"><svg id="ch" role="img" aria-label="Grafikon težine"></svg></div>':'<p class="mute">Grafikon se pojavljuje kad upišeš bar dva mjerenja.</p>')+
 '<table>'+ws.slice().reverse().map(x=>'<tr><td>'+new Date(x.d).toLocaleDateString('sr-Latn-ME')+'</td><td class="n">'+x.kg+' kg</td><td class="n"><button class="x" data-del="'+x.d+'" aria-label="Obriši">×</button></td></tr>').join('')+'</table></div>';
}
const MS=[['struk','Struk'],['kuk','Kukovi'],['but','Butina'],['ruka','Nadlaktica']];
function vMeas(){const M=S.meas||[],f=M[0],l=M[M.length-1];
 const ch=k=>f&&l&&f[k]&&l[k]&&M.length>1?((l[k]-f[k]>0?'+':'')+(l[k]-f[k]).toFixed(1)):'';
 return '<form class="card" id="mf"><h3>Mjere tijela (cm)</h3><p class="mute" style="margin:4px 0 0">Jednom mjesečno, ujutru, centimetrom preko gole kože. Upiši samo ono što izmjeriš.</p><div class="row">'+
 MS.map(([k,t])=>'<div><label for="m_'+k+'">'+t+'</label><input id="m_'+k+'" type="number" inputmode="decimal" step="0.5" min="10" max="250"></div>').join('')+
 '</div><p class="mute" id="mmsg"></p><button class="btn">Sačuvaj mjere</button>'+
 (M.length?'<table class="stack" style="margin-top:14px"><thead><tr><th>Datum</th>'+MS.map(x=>'<th>'+x[1]+'</th>').join('')+'<th></th></tr></thead><tbody>'+
 (M.length>1?'<tr><td><b>Promjena</b></td>'+MS.map(x=>'<td class="n" data-l="'+x[1]+'"><b>'+ch(x[0])+'</b></td>').join('')+'<td></td></tr>':'')+
 M.slice().reverse().map(x=>'<tr><td>'+fmtD(x.d)+x.d.slice(0,4)+'.</td>'+MS.map(y=>'<td class="n" data-l="'+y[1]+'">'+(x[y[0]]||'–')+'</td>').join('')+'<td class="n"><button type="button" class="x" data-mdel="'+x.d+'" aria-label="Obriši">×</button></td></tr>').join('')+'</tbody></table>':'')+'</form>'}
let ro=null;
function bindNap(){
 $('#mf').addEventListener('submit',e=>{e.preventDefault();const o={d:today()};let n=0;MS.forEach(([k])=>{const v=+$('#m_'+k).value;if(v>=10&&v<=250){o[k]=v;n++}});
  if(!n){$('#mmsg').textContent='Upiši bar jednu mjeru.';return}S.meas=(S.meas||[]).filter(x=>x.d!=o.d).concat(o).sort((a,b)=>a.d<b.d?-1:1);save();render()});
 document.querySelectorAll('[data-mdel]').forEach(b=>b.addEventListener('click',()=>{S.meas=(S.meas||[]).filter(x=>x.d!=b.dataset.mdel);save();render()}));
 $('#wf').addEventListener('submit',e=>{e.preventDefault();const v=+$('#nw').value;if(v>=30&&v<=250){addW(v);save();render()}});
 document.querySelectorAll('[data-del]').forEach(b=>b.addEventListener('click',()=>{S.weights=S.weights.filter(x=>x.d!=b.dataset.del);save();render()}));
 const s=$('#ch');if(!s)return;
 const draw=()=>{const W2=s.clientWidth,H=s.clientHeight,ws=S.weights,pad=34;if(!W2)return;
  const ks=ws.map(x=>x.kg),mn=Math.min(...ks)-1,mx=Math.max(...ks)+1;
  const X=i=>pad+i*(W2-pad-12)/(ws.length-1),Y=v=>12+(mx-v)/(mx-mn)*(H-40);
  const pts=ws.map((x,i)=>X(i)+','+Y(x.kg)).join(' ');
  s.innerHTML=[mn+1,mx-1].map(v=>'<line x1="'+pad+'" x2="'+(W2-12)+'" y1="'+Y(v)+'" y2="'+Y(v)+'" stroke="var(--line)"/><text x="0" y="'+(Y(v)+5)+'" font-size="13" fill="var(--mute)">'+Math.round(v)+'</text>').join('')+
  '<polyline points="'+pts+'" fill="none" stroke="var(--red)" stroke-width="3" stroke-linejoin="round"/>'+
  ws.map((x,i)=>'<circle cx="'+X(i)+'" cy="'+Y(x.kg)+'" r="4.5" fill="var(--red)"/>').join('')+
  (W2>420?'<text x="'+pad+'" y="'+(H-6)+'" font-size="13" fill="var(--mute)">'+ws[0].d.slice(5).split('-').reverse().join('.')+'</text><text x="'+(W2-12)+'" y="'+(H-6)+'" font-size="13" fill="var(--mute)" text-anchor="end">'+ws[ws.length-1].d.slice(5).split('-').reverse().join('.')+'</text>':'')};
 if(ro)ro.disconnect();ro=new ResizeObserver(draw);ro.observe(s);
}

const ERR={'auth/invalid-credential':'Pogrešan email ili lozinka.','auth/wrong-password':'Pogrešan email ili lozinka.','auth/user-not-found':'Ne postoji nalog sa tim emailom.','auth/email-already-in-use':'Nalog sa tim emailom već postoji, prijavi se.','auth/weak-password':'Lozinka mora imati bar 6 znakova.','auth/invalid-email':'Email nije ispravan.','auth/too-many-requests':'Previše pokušaja, sačekaj malo.','auth/network-request-failed':'Nema interneta.'};
function vLogin(){
 return '<form class="card" id="lf" novalidate><h2>Prijava</h2><p class="mute">Svako ima svoj nalog, svoj plan i svoj dnevnik težine, na bilo kom telefonu.</p>'+
 '<label for="em">Email</label><input id="em" type="email" autocomplete="email" inputmode="email">'+
 '<label for="pw">Lozinka</label><input id="pw" type="password" autocomplete="current-password">'+
 '<p id="lerr" style="color:var(--red);min-height:1.5em;margin:10px 0"></p>'+
 '<div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn" id="bin">Prijavi se</button><button class="btn ghost" type="button" id="bup">Napravi nalog</button></div>'+
 '<button type="button" class="btn ghost" id="gg" style="width:100%;margin-top:14px">Nastavi sa Google nalogom</button>'+
 '<p style="margin:14px 0 0"><button type="button" class="chip" id="fp">Zaboravljena lozinka?</button></p></form>';
}
function bindLogin(){
 const msg=(t,ok)=>{const e=$('#lerr');e.textContent=t;e.style.color=ok?'var(--blue)':'var(--red)'};
 const fail=e=>{if(e.code=='auth/popup-closed-by-user'||e.code=='auth/cancelled-popup-request')return msg('');msg(ERR[e.code]||'Nešto nije u redu, pokušaj ponovo.')};
 const vals=()=>{const em=$('#em').value.trim(),pw=$('#pw').value;if(!em||!pw){msg('Upiši email i lozinku.');return null}return [em,pw]};
 $('#lf').addEventListener('submit',e=>{e.preventDefault();const v=vals();if(v){msg('Prijavljujem…',1);signInWithEmailAndPassword(auth,...v).catch(fail)}});
 $('#bup').addEventListener('click',()=>{const v=vals();if(v){msg('Pravim nalog…',1);createUserWithEmailAndPassword(auth,...v).catch(fail)}});
 $('#gg').addEventListener('click',()=>{const p=new GoogleAuthProvider();signInWithPopup(auth,p).catch(e=>{if(e.code=='auth/popup-blocked')signInWithRedirect(auth,p);else fail(e)})});
 $('#fp').addEventListener('click',()=>{const em=$('#em').value.trim();if(!em)return msg('Prvo upiši email iznad.');sendPasswordResetEmail(auth,em).then(()=>msg('Poslao sam link za novu lozinku na '+em+'.',1)).catch(fail)});
}
onAuthStateChanged(auth,async u=>{
 authReady=true;
 if(!u){uid=null;S=EMPTY();render();return}
 $('#app').innerHTML='<p class="mute">Učitavam tvoje podatke…</p>';
 try{const snap=await getDoc(doc(fdb,'users',u.uid));S=Object.assign(EMPTY(),snap.exists()?snap.data():{})}
 catch(e){console.log('[trening] load',e);S=EMPTY()}
 uid=u.uid;
 if(S.skin){skin=S.skin;try{localStorage.setItem('trening-skin',skin)}catch(e){}applySkin()}
 tab=S.profile?'plan':'pro';render();
});
function render(){
 if(S.log||S.custom){const fx=n=>String(n).replace(/u\u0107ic/g,'učic').replace('Visenje na \u0161ipci','Visenje na vratilu');
  if(S.log)for(const k of Object.keys(S.log)){const n=fx(k);if(n!==k){S.log[n]=(S.log[n]||[]).concat(S.log[k]);delete S.log[k]}}
  if(S.custom)for(const c of Object.values(S.custom))for(const d in c)if(Array.isArray(c[d]))c[d]=c[d].map(fx)}
 document.documentElement.dataset.hint=S.hideHow?'off':'';
 QW=null;
 $('#nav').style.display=uid?'':'none';
 if(!uid){header();$('#app').innerHTML=authReady?vLogin():'<p class="mute">Učitavam…</p>';if(authReady)bindLogin();return}
 if(!S.profile)tab='pro';
 header();
 const V={plan:[vPlan,bindPlan],cal:[vCal,bindCal],go:[vGo,bindGo],nap:[vNap,bindNap],pro:[vPro,bindPro]}[tab];
 $('#app').innerHTML=V[0]();
 if(!S.profile||tab=='pro')bindPro();else V[1]();
}
render();
}
